name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"
            cd /opt/channel-filter
            git pull --ff-only
            cat > .env << 'EOF'
            API_ID=${{ secrets.DEPLOY_API_ID }}
            API_HASH=${{ secrets.DEPLOY_API_HASH }}
            BOT_TOKEN=${{ secrets.DEPLOY_BOT_TOKEN }}
            SOURCE_CHANNEL=${{ secrets.DEPLOY_SOURCE_CHANNEL }}
            ADMIN_CHAT_ID=${{ secrets.DEPLOY_ADMIN_CHAT_ID }}
            DB_PATH=./channel_filter.db
            EOF
            uv sync
            sudo systemctl restart channel-filter
            sleep 2
            sudo systemctl is-active --quiet channel-filter
