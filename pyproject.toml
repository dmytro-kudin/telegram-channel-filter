[project]
name = "channel-filter"
version = "0.1.0"
description = "Telegram channel keyword filter bot"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3.4",
    "pyahocorasick>=2.1",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channel_filter"]
